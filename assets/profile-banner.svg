<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Silas financial AI profile banner</title>
  <desc id="desc">A dark gradient banner representing grounded, auditable and measurable financial AI systems.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#c7d2fe" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="22" fill="url(#background)"/>
  <rect width="1200" height="260" rx="22" fill="url(#grid)"/>
  <circle cx="1110" cy="28" r="170" fill="#7c3aed" opacity="0.12"/>
  <circle cx="980" cy="240" r="145" fill="#06b6d4" opacity="0.09"/>

  <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.6" fill="none">
    <path d="M790 130L875 70L970 106L1060 54"/>
    <path d="M790 130L880 190L970 160L1082 207"/>
    <path d="M970 106L970 160"/>
    <path d="M875 70L880 190" stroke-opacity="0.25"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="790" cy="130" r="10" fill="#22d3ee"/>
    <circle cx="875" cy="70" r="8" fill="#60a5fa"/>
    <circle cx="880" cy="190" r="8" fill="#34d399"/>
    <circle cx="970" cy="106" r="9" fill="#a78bfa"/>
    <circle cx="970" cy="160" r="9" fill="#c084fc"/>
    <circle cx="1060" cy="54" r="8" fill="#f472b6"/>
    <circle cx="1082" cy="207" r="8" fill="#fb7185"/>
  </g>

  <text x="64" y="92" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Financial AI, Built for Real Systems</text>
  <text x="66" y="136" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="21">10+ years in financial data · Agent · RAG · NL2SQL · Evaluation</text>
  <rect x="64" y="176" width="570" height="2" fill="url(#accent)" opacity="0.9"/>
  <text x="66" y="213" fill="#a5f3fc" font-family="Consolas, Menlo, monospace" font-size="17" letter-spacing="2">GROUNDED  •  AUDITABLE  •  MEASURABLE</text>
</svg>
